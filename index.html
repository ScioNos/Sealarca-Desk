<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sealarca-Desk — L'IA dans un coffre-fort numérique</title>
    
    <!-- Sécurité CSP stricte : Aucun script externe, requêtes autorisées uniquement vers Sealarca Vault et local -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: blob: data:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' file: data:; connect-src 'self' file: blob: data: https://api.sealarca.ch http://localhost:* http://127.0.0.1:*; worker-src 'self' file: blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none';">
    <script src="js/boot-theme.js?v=1.1.0"></script>

    <!-- Feuilles de style officielles Sealarca -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>

    <!-- Application Shell réactive Alpine.js -->
    <div class="app-shell" x-data="sealarcaApp" @keydown.window="handleWindowKeydown">

        <!-- =================================================================
             1. Barre Latérale (Sidebar)
             ================================================================= -->
        <aside class="sidebar" :class="sidebarClass" :inert="hasAnyModal">
            <!-- En-tête -->
            <div class="sidebar-header">
                <button type="button" class="sidebar-brand" @click="newConversation" :aria-label="appNewChat">
                    <img src="images/logo-light.png" alt="Sealarca" class="sidebar-logo theme-logo-light">
                    <img src="images/logo.png" alt="Sealarca" class="sidebar-logo theme-logo-dark">
                    <span class="sidebar-badge" x-text="appDesk"></span>
                </button>
                <button type="button" class="sidebar-mobile-close" @click="toggleSidebar" :aria-label="appClose" :title="appClose">&times;</button>
            </div>


            <!-- Dossiers / Projets -->
            <div class="folder-panel">
                <div class="folder-panel-header">
                    <span x-text="appFolders"></span>
                    <button type="button" class="folder-add-btn" @click="createFolder" :title="appNewFolder" aria-label="Nouveau dossier">+</button>
                </div>
                <div class="folder-list">
                    <template x-for="folder in folders" :key="folder.id">
                        <div class="folder-item" :class="folder.rowClass">
                            <button type="button" class="folder-select" @click="folder.select" :aria-current="folder.isActive ? 'page' : null">
                                <span aria-hidden="true">▣</span>
                                <span x-text="folder.name"></span>
                            </button>
                            <div class="folder-actions">
                                <button type="button" class="conv-action-btn" @click="folder.edit" :title="appEdit" :aria-label="appEdit">✎</button>
                                <button type="button" class="conv-action-btn" @click="folder.remove" :title="appDelete" :aria-label="appDelete">×</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            <!-- Bouton Nouvelle Conversation -->
            <button type="button" class="btn-new-chat" @click="newConversation" :title="appNewChat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span x-text="appNewChat"></span>
            </button>

            <!-- Recherche dans l'historique -->
            <div class="sidebar-search">
                <div class="search-input-wrapper">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" class="sidebar-search-input" :placeholder="appSearchPlaceholder" :aria-label="appSearchPlaceholder" :value="searchQuery" @input="updateSearchQuery">
                </div>
            </div>

            <!-- Liste des Conversations -->
            <div class="sidebar-conv-list">
                <template x-for="conv in filteredConversations" :key="conv.id">
                    <div class="conv-item" :class="conv.rowClass">
                        <button type="button" class="conv-select" @click="conv.select" :aria-current="conv.isActive ? 'page' : null">
                            <span class="conv-item-title" x-text="conv.title"></span>
                        </button>
                        <div class="conv-item-actions">
                            <button type="button" class="conv-action-btn" :title="appDelete" :aria-label="appDelete" @click="conv.remove">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
                            </button>
                        </div>
                    </div>
                </template>
                <div x-show="hasNoConversations" style="padding: 20px 10px; text-align: center; color: var(--sealarca-ink-muted); font-size: 12px;" x-text="appNoConversations">
                </div>
            </div>

            <!-- Pied de page Sidebar -->
            <div class="sidebar-footer">
                <!-- Mode de travail actif -->
                <button type="button" class="footer-btn" @click="openRoles" :title="roleButtonTitle" :aria-label="roleButtonTitle">
                    <span x-text="selectedRoleIcon"></span>
                    <span class="footer-btn-label"><span class="footer-btn-kicker" x-text="appRoles"></span><span x-text="selectedRoleName"></span><small class="footer-btn-hint" x-text="roleButtonHint"></small></span>
                </button>

                <!-- Ligne Paramètres & Thème -->
                <div class="sidebar-footer-row">
                    <button type="button" class="footer-btn" @click="openSettings" :title="appApiKey">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                        <span x-text="appApiKey"></span>
                    </button>

                    <button type="button" class="footer-btn" @click="toggleTheme" :title="themeButtonLabel" :aria-label="themeButtonLabel" style="max-width: 44px;">
                        <span x-show="showMoonIcon">🌙</span>
                        <span x-show="showSunIcon">☀️</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- =================================================================
             2. Zone Principale (Chat View)
             ================================================================= -->
        <main class="main-view" :inert="hasAnyModal">
            <!-- En-tête supérieur -->
            <header class="chat-header">
                <div class="header-left">
                    <button type="button" class="sidebar-toggle-btn" @click="toggleSidebar" title="Sidebar" aria-label="Afficher ou masquer la barre latérale">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                    </button>

                    <div class="active-folder-label" title="Dossier actif">
                        <span aria-hidden="true">▣</span>
                        <span x-text="activeFolderName"></span>
                    </div>

                    <!-- Sélecteur de Modèle du Vault -->
                    <div class="model-picker-group">
                        <div class="model-picker-row">
                            <label class="model-picker-label" for="header-model-picker" x-text="modelPickerLabel"></label>
                            <select id="header-model-picker" class="model-picker" :value="selectedModel" @change="updateSelectedModel" :disabled="modelsDisabled" :aria-label="modelPickerLabel" aria-describedby="model-picker-hint">
                                <option value="" x-text="modelChoosePrompt"></option>
                                <template x-for="m in models" :key="m.id">
                                    <option :value="m.id" x-text="m.name"></option>
                                </template>
                                <template x-if="hasNoModels">
                                    <option value="" x-text="appConnecting"></option>
                                </template>
                            </select>
                        </div>
                        <span id="model-picker-hint" class="model-picker-hint" x-show="!selectedModel" x-text="modelPickerHint"></span>
                    </div>
                </div>

                <div class="header-right">
                    <button type="button" class="header-documents-btn" @click="openDocuments" :title="appDocuments">
                        <span aria-hidden="true">📚</span>
                        <span x-text="appDocuments"></span>
                    </button>

                    <!-- Sélecteur de langue avec drapeaux locaux -->
                    <div class="language-switcher" role="group" aria-label="Langue de l’interface">
                        <template x-for="lang in supportedLangs" :key="lang.code">
                            <button type="button" class="language-button"
                                @click="lang.select"
                                :title="lang.name"
                                :aria-label="lang.name"
                                :aria-pressed="lang.isActive"
                                :class="lang.buttonClass">
                                <img class="language-flag" :src="lang.flagSrc" alt="" aria-hidden="true">
                            </button>
                        </template>
                    </div>

                    <!-- Badge Secret Professionnel / Vault -->
                    <div class="vault-status-badge">
                        <span class="vault-status-dot"></span>
                        <span x-text="appVaultStatus"></span>
                    </div>
                </div>
            </header>

            <!-- Zone de défilement des messages -->
            <div id="chat-messages" class="chat-messages">
                <div class="messages-inner">

                    <!-- Écran d'accueil / État vide -->
                    <template x-if="showEmptyState">
                        <div class="empty-state">
                            <img src="images/logo-light.png" alt="Sealarca" class="empty-logo theme-logo-light">
                            <img src="images/logo.png" alt="Sealarca" class="empty-logo theme-logo-dark">
                            <h1 class="empty-title" x-text="emptyTitle"></h1>
                            <p class="empty-desc" x-text="emptyDesc"></p>

                            <!-- Cartes de suggestions de prompts -->
                            <div class="prompt-suggestions">
                                <button type="button" class="suggestion-card" @click="useSuggestion1">
                                    <div class="suggestion-card-title" x-text="emptyCard1Title"></div>
                                    <div class="suggestion-card-subtitle" x-text="emptyCard1Desc"></div>
                                </button>
                                <button type="button" class="suggestion-card" @click="useSuggestion2">
                                    <div class="suggestion-card-title" x-text="emptyCard2Title"></div>
                                    <div class="suggestion-card-subtitle" x-text="emptyCard2Desc"></div>
                                </button>
                                <button type="button" class="suggestion-card" @click="useSuggestion3">
                                    <div class="suggestion-card-title" x-text="emptyCard3Title"></div>
                                    <div class="suggestion-card-subtitle" x-text="emptyCard3Desc"></div>
                                </button>
                            </div>
                        </div>
                    </template>

                    <!-- Liste des messages -->
                    <template x-for="msg in messages" :key="msg.id">
                        <div class="message-row" :class="msg.role">
                            <!-- En-tête du message -->
                            <div class="message-header">
                                <div class="message-sender">
                                    <div class="message-sender-avatar" :class="msg.role">
                                    <span x-text="msg.senderInitial"></span>
                                    </div>
                                <span x-text="msg.senderName"></span>
                                <template x-if="msg.interrupted"><span class="message-status-interrupted" x-text="msg.interruptedLabel"></span></template>
                                </div>
                                <div class="message-actions">
                                <button type="button" class="msg-action-btn" :title="appCopy" @click="msg.copy">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                    <span x-text="appCopy"></span>
                                    </button>
                                </div>
                            </div>

                            <!-- Bulle du message -->
                            <div class="message-bubble">
                                <!-- Pièces jointes (si message utilisateur) -->
                            <template x-if="msg.hasAttachments">
                                    <div class="msg-attachments-list">
                                        <template x-for="doc in msg.visibleAttachments" :key="doc.attachmentKey">
                                            <span class="msg-attachment-item">
                                                <span>📎</span>
                                                <span x-text="doc.name"></span>
                                            </span>
                                        </template>
                                    </div>
                                </template>

                                <!-- Tiroir de Raisonnement (si présent dans la réponse assistant) -->
                            <template x-if="msg.hasReasoning">
                                    <div class="reasoning-box">
                                    <button type="button" class="reasoning-toggle" @click="msg.toggleReasoning">
                                        <span x-text="reasoningDrawerTitle"></span>
                                        <span x-text="msg.reasoningLabel"></span>
                                    </button>
                                    <div class="reasoning-content" x-show="msg.reasoningVisible" x-text="msg.reasoning"></div>
                                    </div>
                                </template>

                                <!-- Rendu Markdown du contenu -->
                            <div class="markdown-body" x-safe-html="msg.renderedContent"></div>
                            <template x-if="msg.hasCitations">
                                <div class="message-citations"><strong>Sources citées</strong><template x-for="citation in msg.visibleCitations" :key="citation.documentId + citation.sourceId"><button type="button" @click="citation.open" x-text="citation.label"></button></template></div>
                            </template>
                            </div>
                        </div>
                    </template>

                    <!-- Message en cours de Streaming -->
                    <template x-if="isStreaming">
                        <div class="message-row assistant">
                            <div class="message-header">
                                <div class="message-sender">
                                    <div class="message-sender-avatar assistant">S</div>
                                    <span>Sealarca Vault</span>
                                </div>
                                <div class="typing-indicator">
                                    <span class="typing-dot"></span>
                                    <span class="typing-dot"></span>
                                    <span class="typing-dot"></span>
                                </div>
                            </div>

                            <div class="message-bubble">
                                <!-- Tiroir de raisonnement en direct -->
                                <template x-if="currentStreamingReasoning">
                                    <div class="reasoning-box">
                                <button type="button" class="reasoning-toggle" @click="toggleLiveReasoning">
                                    <span x-text="reasoningThinking"></span>
                                    <span x-text="reasoningLiveToggleLabel"></span>
                                        </button>
                                        <div class="reasoning-content" x-show="isReasoningOpen" x-text="currentStreamingReasoning"></div>
                                    </div>
                                </template>

                                <!-- Contenu textuel en direct -->
                            <div class="markdown-body" x-safe-html="streamingMarkdown"></div>
                            </div>
                        </div>
                    </template>

                </div>
            </div>

            <!-- =================================================================
                 3. Barre de Saisie Inférieure (Input)
                 ================================================================= -->
            <div class="chat-input-wrapper">
                <div class="chat-input-box" :class="inputBoxClass"
                     @dragover.prevent="dragOver"
                     @dragleave.prevent="dragLeave"
                     @drop.prevent="handleDrop">

                    <!-- Fichiers joints en attente d'envoi -->
                    <template x-if="hasAttachedFiles">
                        <div class="attachments-bar">
                        <template x-for="file in attachedFiles" :key="file.id">
                                <div class="attachment-chip">
                                    <span>📄</span>
                                    <span x-text="file.name"></span>
                                    <button type="button" class="attachment-chip-remove" @click="file.remove" :title="appDelete">
                                        &times;
                                    </button>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Zone de texte auto-extensible -->
                    <textarea id="chat-textarea" class="chat-textarea" rows="1"
                              :placeholder="inputPlaceholder"
                              :aria-label="inputPlaceholder"
                              :value="inputPrompt"
                              @keydown="handlePromptKeydown"
                              @input="updatePrompt" @keyup="resizePrompt"></textarea>

                    <!-- Barre d'outils et Boutons -->
                    <div class="chat-toolbar">
                        <div class="toolbar-left">
                            <!-- Input de fichier caché -->
                            <input type="file" id="file-input-hidden" multiple style="display: none;"
                                   accept=".pdf,.docx,.xlsx,.pptx,.odt,.ods,.csv,.txt,.md,.json,.rtf,.log,.xml"
                                   @change="handleFileInput">

                            <button type="button" class="toolbar-btn" @click="openFilePicker" :title="inputAttachDoc">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                                <span x-text="appAddDocuments"></span>
                            </button>

                            <button type="button" class="toolbar-btn" @click="openRoles" :title="roleButtonTitle" :aria-label="roleButtonTitle">
                                <span x-text="selectedRoleIcon"></span>
                                <span x-text="selectedInputRoleName"></span>
                            </button>
                        </div>

                        <div>
                            <!-- Bouton Envoyer ou Arrêter -->
                            <button type="button" class="btn-send" :class="sendButtonClass"
                                    @click="sendOrStop"
                                    :title="inputActionTitle" :aria-label="inputActionTitle">
                                <template x-if="showSendIcon">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                </template>
                                <template x-if="showStopIcon">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
                                </template>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- =================================================================
             4. Modale de Configuration & Clé API
             ================================================================= -->
        <div class="modal-overlay" x-cloak x-show="isSettingsOpen" x-transition :aria-hidden="!isSettingsOpen" :inert="hasAnyModal && !isSettingsOpen">
            <div class="modal-card" data-modal="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-describedby="settings-description" @click.away="closeSettings">
                <div class="modal-header">
                    <h2 class="modal-title" id="settings-title" x-text="settingsTitle"></h2>
                    <button type="button" class="modal-close" @click="closeSettings" x-show="hasConfiguredApi" :aria-label="settingsCloseLabel">&times;</button>
                </div>

                <div class="modal-body">
                    <p id="settings-description" style="font-size: 13px; color: var(--sealarca-ink-muted); line-height: 1.5;" x-text="settingsDesc"></p>
                    <section class="settings-prerequisites" aria-labelledby="settings-prerequisites-title">
                        <h3 id="settings-prerequisites-title" x-text="settingsPrerequisitesTitle"></h3>
                        <ol>
                            <template x-for="item in settingsPrerequisites" :key="item.number">
                                <li><span x-text="item.number"></span><span x-text="item.label"></span></li>
                            </template>
                        </ol>
                        <div class="settings-help-links">
                            <a class="external-help-link" :href="settingsStartUrl" target="_blank" rel="noopener noreferrer" x-text="settingsGetKeyLabel"></a>
                            <a class="external-help-link" :href="settingsKeysUrl" target="_blank" rel="noopener noreferrer" x-text="settingsOpenKeysLabel"></a>
                        </div>
                    </section>

                    <!-- Alerte Erreur -->
                    <template x-if="apiError">
                        <div role="alert" aria-live="assertive" style="padding: 10px 12px; border-radius: var(--radius-sm); background-color: var(--sealarca-danger-light); color: var(--sealarca-danger); font-size: 12px;" x-text="apiError"></div>
                    </template>

                    <div class="settings-stage-label"><span>1</span><strong x-text="settingsStepOne"></strong></div>
                    <div class="form-group">
                        <label class="form-label" for="api-key-input" x-text="settingsApiKeyLabel"></label>
                        <div class="api-key-field-row">
                            <input :type="apiKeyInputType" id="api-key-input" class="form-input" placeholder="sk-sealarca-..." :value="apiKey" @input="updateApiKey"
                                   autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="api-key-hint">
                            <button type="button" class="btn btn-secondary api-key-toggle" @click="toggleApiKeyVisibility" :aria-label="settingsToggleKeyLabel" :title="settingsToggleKeyLabel">👁</button>
                        </div>
                        <span class="form-hint" id="api-key-hint" x-text="settingsApiKeyHint"></span>
                    </div>

                    <!-- Liste des modèles découverts -->
                    <div class="settings-stage-label" x-show="hasModels"><span>2</span><strong x-text="settingsStepTwo"></strong></div>
                    <div class="form-group" x-show="hasModels">
                        <span class="form-label" id="settings-models-label" x-text="settingsModelsTitle"></span>
                        <span class="form-hint" x-text="settingsModelsHint"></span>
                        <label class="sr-only" for="settings-model-picker" x-text="modelPickerLabel"></label>
                        <select id="settings-model-picker" class="form-select" :value="selectedModel" @change="updateSelectedModel" aria-labelledby="settings-models-label" :aria-label="modelPickerLabel">
                            <option value="" x-text="modelChoosePrompt"></option>
                            <template x-for="m in models" :key="m.id">
                                <option :value="m.id" x-text="m.name"></option>
                            </template>
                        </select>
                        <div style="max-height: 140px; overflow-y: auto; border: 1px solid var(--sealarca-border); border-radius: var(--radius-sm); padding: 6px;">
                            <template x-for="m in models" :key="m.id">
                                <div style="padding: 6px 8px; font-size: 12px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--sealarca-border-subtle);">
                                    <span style="font-weight: 600;" x-text="m.name"></span>
                                    <span style="color: var(--sealarca-ink-muted); font-family: var(--font-mono);" x-text="m.id"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" @click="toggleTheme" :title="themeButtonLabel" :aria-label="themeButtonLabel">🌓</button>
                    <button type="button" class="btn btn-secondary" @click="forgetApiKey" x-show="hasApiKey" x-text="settingsForgetLabel"></button>
                    <button type="button" class="btn btn-primary" x-show="hasNoModels" @click="discoverModels" :disabled="settingsActionsDisabled">
                        <span x-text="settingsTestLabel"></span>
                    </button>
                    <button type="button" class="btn btn-primary" x-show="hasModels" @click="saveSettings" :disabled="settingsSaveDisabled" x-text="settingsSaveLabel">
                    </button>
                </div>
            </div>
        </div>

        <!-- =================================================================
             5. Modale de sélection des modes de travail
             ================================================================= -->
        <div class="modal-overlay" x-cloak x-show="isRolesOpen" x-transition :aria-hidden="!isRolesOpen" :inert="hasAnyModal && !isRolesOpen">
            <div class="modal-card" data-modal="roles" role="dialog" aria-modal="true" aria-labelledby="roles-title" aria-describedby="roles-description" @click.away="closeRoles">
                <div class="modal-header">
                    <h2 class="modal-title" id="roles-title" x-text="rolesTitle"></h2>
                    <button type="button" class="modal-close" @click="closeRoles" :aria-label="rolesCloseLabel">&times;</button>
                </div>

                <div class="modal-body">
                    <p id="roles-description" style="font-size: 13px; color: var(--sealarca-ink-muted); line-height: 1.5;" x-text="rolesDesc"></p>

                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <template x-for="role in roles" :key="role.id">
                            <button type="button" class="role-card"
                                 :style="role.cardStyle"
                                 @click="role.select" :aria-pressed="role.isSelected">
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;">
                                    <div style="font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                                        <span x-text="role.icon"></span>
                                        <span x-text="role.name"></span>
                                    </div>
                                    <template x-if="role.isSelected">
                                        <span style="font-size: 11px; font-weight: 700; color: var(--sealarca-evergreen);" x-text="rolesActiveBadge"></span>
                                    </template>
                                </div>
                                <p style="font-size: 12px; color: var(--sealarca-ink-muted); line-height: 1.4;" x-text="role.description"></p>
                            </button>
                        </template>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" @click="closeRoles" x-text="rolesCloseLabel"></button>
                </div>
            </div>
        </div>


        <!-- Espace documentaire du dossier -->
        <div class="modal-overlay" x-cloak x-show="isDocumentsOpen" x-transition :aria-hidden="!isDocumentsOpen" :inert="hasAnyModal && !isDocumentsOpen">
            <div class="modal-card modal-card-wide folder-workspace" data-modal="documents" role="dialog" aria-modal="true" aria-labelledby="documents-title" aria-describedby="documents-description" @click.away="closeDocuments">
                <div class="modal-header folder-workspace-header">
                    <div>
                        <span class="workspace-kicker" x-text="documentsWorkspaceKicker"></span>
                        <h2 class="modal-title" id="documents-title" x-text="activeFolderName"></h2>
                        <p class="modal-subtitle" id="documents-description" x-text="documentsWorkspaceSubtitle"></p>
                    </div>
                    <button type="button" class="modal-close" @click="closeDocuments" :aria-label="documentsCloseLabel">&times;</button>
                </div>
                <div class="workspace-tabs" role="tablist" aria-label="Espace documentaire" @keydown="handleWorkspaceTabsKeydown">
                    <button type="button" id="overview-tab" class="workspace-tab" :class="overviewTabClass" role="tab" aria-controls="overview-panel" :aria-selected="isOverviewTab" @click="openOverviewTab" x-text="documentsOverviewTab"></button>
                    <button type="button" id="library-tab" class="workspace-tab" :class="libraryTabClass" role="tab" aria-controls="library-panel" :aria-selected="isLibraryTab" @click="openLibraryTab" x-text="documentsLibraryTab"></button>
                    <button type="button" id="search-tab" class="workspace-tab" :class="searchTabClass" role="tab" aria-controls="search-panel" :aria-selected="isSearchTab" @click="openSearchTab" x-text="documentsSearchTab"></button>
                    <button type="button" id="jobs-tab" class="workspace-tab" :class="jobsTabClass" role="tab" aria-controls="jobs-panel" :aria-selected="isJobsTab" @click="openJobsTab" x-text="documentsJobsTab"></button>
                </div>

                <div class="modal-body workspace-body">
                    <section id="overview-panel" x-show="isOverviewTab" class="overview-panel" role="tabpanel" aria-labelledby="overview-tab" :aria-hidden="!isOverviewTab" tabindex="0">
                        <div class="overview-commandbar">
                            <div>
                                <h3 x-text="documentsOverviewTitle"></h3>
                                <p x-text="documentsOverviewDescription"></p>
                            </div>
                            <div class="overview-actions">
                                <button type="button" class="btn btn-secondary" @click="exportFolderOverviewMarkdown" x-text="documentsExportOverview"></button>
                                <button type="button" class="btn btn-primary" @click="queueAllDocumentProfiles" x-text="documentsGenerateMissing"></button>
                            </div>
                        </div>
                        <div class="overview-stats">
                            <div class="overview-stat"><span x-text="documentsDocumentStat"></span><strong x-text="folderOverview.documentCount"></strong></div>
                            <div class="overview-stat"><span x-text="documentsVolumeStat"></span><strong x-text="folderOverviewPagesLabel"></strong></div>
                            <div class="overview-stat"><span x-text="documentsProfilesStat"></span><strong x-text="folderOverviewProfilesLabel"></strong></div>
                        </div>
                        <div class="overview-grid">
                            <article class="overview-section overview-documents">
                                <div class="overview-section-title"><span x-text="documentsSectionLabel"></span><small x-text="folderOverview.documentCount"></small></div>
                                <div class="overview-empty" x-show="hasNoDocuments" x-text="documentsOverviewEmpty"></div>
                                <div class="overview-document-list" x-show="hasDocuments">
                                    <template x-for="doc in documents" :key="doc.id">
                                        <button type="button" class="overview-document" @click="doc.preview">
                                            <span class="document-type-mark" x-text="doc.extension"></span>
                                            <span><strong x-text="doc.name"></strong><small class="extraction-warning" x-show="doc.warningText" x-text="doc.warningText"></small><small><span x-text="doc.pageLabel"></span><span x-text="doc.profileStatusLabel"></span></small></span>
                                            <span aria-hidden="true">↗</span>
                                        </button>
                                    </template>
                                </div>
                            </article>
                            <article class="overview-section">
                                <div class="overview-section-title"><span x-text="documentsPeopleOrganizations"></span></div>
                                <div class="entity-cloud">
                                    <template x-for="person in folderOverview.people" :key="person"><span class="entity-chip person" x-text="person"></span></template>
                                    <template x-for="organization in folderOverview.organizations" :key="organization"><span class="entity-chip organization" x-text="organization"></span></template>
                                </div>
                                <div class="overview-empty" x-show="hasNoOverviewEntities" x-text="documentsOverviewEntitiesEmpty"></div>
                            </article>
                            <article class="overview-section">
                                <div class="overview-section-title"><span x-text="documentsDatesSection"></span></div>
                                <ul class="overview-fact-list">
                                    <template x-for="item in folderOverview.dates" :key="item.id"><li><button type="button" class="overview-date-link" @click="item.open"><strong x-text="item.date"></strong><span x-text="item.label"></span><small x-text="item.referenceLabel"></small></button></li></template>
                                </ul>
                            </article>
                            <article class="overview-section">
                                <div class="overview-section-title"><span x-text="documentsItemsSection"></span></div>
                                <div class="overview-fact-list">
                                    <template x-for="item in folderOverview.items" :key="item.id">
                                        <button type="button" class="important-item" @click="item.open"><strong x-text="item.label"></strong><span x-text="item.details"></span><small x-text="item.referenceLabel"></small></button>
                                    </template>
                                </div>
                            </article>
                        </div>
                    </section>

                    <section id="library-panel" x-show="isLibraryTab" class="document-library" role="tabpanel" aria-labelledby="library-tab" :aria-hidden="!isLibraryTab" tabindex="0">
                        <div class="document-library-toolbar library-toolbar-stacked">
                            <div>
                                <strong x-text="documentsContextTitle"></strong>
                                <div class="context-mode-switch" role="radiogroup" :aria-label="documentsContextTitle">
                                    <button type="button" role="radio" :class="manualContextClass" :aria-checked="isManualContext" @click="useManualContext" x-text="documentsManualMode"></button>
                                    <button type="button" role="radio" :class="automaticContextClass" :aria-checked="isAutomaticContext" @click="useAutomaticContext" x-text="documentsAutomaticMode"></button>
                                </div>
                                <p x-show="isManualContext" x-text="documentsSelectionHint"></p>
                                <p x-show="isAutomaticContext" x-text="documentsAutomaticHint"></p>
                            </div>
                            <button type="button" class="btn btn-primary" @click="openFilePicker" x-text="appAddDocuments"></button>
                        </div>
                        <div class="document-empty" x-show="hasNoDocuments" x-text="documentsEmptyLabel"></div>
                        <div class="document-list" x-show="hasDocuments">
                            <template x-for="doc in documents" :key="doc.id">
                                <div class="document-row" :class="doc.selectionClass">
                                    <button type="button" class="document-select" @click="doc.toggle" :aria-pressed="doc.isSelected">
                                        <span class="document-check" x-text="doc.selectionMark"></span>
                                        <span class="document-main"><strong x-text="doc.name"></strong><small class="extraction-warning" x-show="doc.warningText" x-text="doc.warningText"></small><small><span x-text="doc.extension"></span> · <span x-text="doc.sizeLabel"></span> · <span x-text="doc.profileStatusLabel"></span></small></span>
                                    </button>
                                    <div class="document-actions">
                                        <button type="button" class="btn btn-secondary btn-compact" @click="doc.generateProfile" x-text="documentsGenerateProfile"></button>
                                        <button type="button" class="btn btn-secondary btn-compact" @click="doc.preview" x-text="documentsPreviewLabel"></button>
                                        <button type="button" class="btn btn-secondary btn-compact" @click="doc.download" x-text="documentsDownloadLabel"></button>
                                        <button type="button" class="conv-action-btn" @click="doc.remove" :title="appDelete">×</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </section>

                    <section id="search-panel" x-show="isSearchTab" class="search-panel" role="tabpanel" aria-labelledby="search-tab" :aria-hidden="!isSearchTab" tabindex="0">
                        <label class="local-search-box"><span aria-hidden="true">⌕</span><span class="sr-only" x-text="documentsSearchLabel"></span><input type="search" :value="documentSearchQuery" @input="updateDocumentSearch" :placeholder="documentsSearchPlaceholder" :aria-label="documentsSearchLabel"></label>
                        <p class="search-scope" x-text="documentsSearchScope"></p>
                        <div class="search-results" x-show="hasDocumentSearchResults">
                            <template x-for="result in documentSearchResults" :key="result.id">
                                <button type="button" class="search-result" @click="result.open"><span class="search-result-reference" x-text="result.reference"></span><p x-text="result.excerpt"></p><small><span x-text="result.matchedTermsLabel"></span></small></button>
                            </template>
                        </div>
                        <div class="document-empty" x-show="hasNoDocumentSearchResults" x-text="documentsNoSearchResults"></div>
                    </section>

                    <section id="jobs-panel" x-show="isJobsTab" class="jobs-panel" role="tabpanel" aria-labelledby="jobs-tab" :aria-hidden="!isJobsTab" tabindex="0">
                        <div class="overview-commandbar"><div><h3 x-text="documentsQueueTitle"></h3><p x-text="documentsQueueDescription"></p></div><button type="button" class="btn btn-primary" @click="queueAllDocumentProfiles" x-text="documentsQueueAction"></button></div>
                        <div class="document-empty" x-show="hasNoProcessingJobs" x-text="documentsNoJobs"></div>
                        <div class="job-list" x-show="hasProcessingJobs">
                            <template x-for="job in processingJobs" :key="job.id">
                                <div class="job-row"><span class="job-status" :class="job.status" x-text="job.statusLabel"></span><span class="job-main"><strong x-text="job.documentName"></strong><small><span x-text="job.checkpointStage"></span><span x-show="job.lastError" x-text="job.lastError"></span></small></span><button type="button" class="btn btn-secondary btn-compact" x-show="job.canCancel" @click="job.cancel" x-text="documentsJobCancel"></button><button type="button" class="btn btn-secondary btn-compact" x-show="job.canRetry" @click="job.retry" x-text="documentsJobRetry"></button></div>
                            </template>
                        </div>
                    </section>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-primary" @click="closeDocuments" x-text="documentsCloseLabel"></button></div>
            </div>
        </div>

        <!-- Consultation du Markdown canonique et de sa provenance -->
        <div class="modal-overlay" x-cloak x-show="isDocumentPreviewOpen" x-transition :aria-hidden="!isDocumentPreviewOpen" :inert="hasAnyModal && !isDocumentPreviewOpen">
            <div class="modal-card modal-card-document" data-modal="preview" role="dialog" aria-modal="true" aria-labelledby="document-preview-title">
                <template x-if="previewDocument">
                    <div class="document-preview-shell">
                        <div class="modal-header">
                            <div>
                                <h2 class="modal-title" id="document-preview-title" x-text="documentPreviewTitle"></h2>
                                <template x-for="warning in documentPreviewWarnings"><p class="extraction-warning" x-text="warning"></p></template>
                                <p class="modal-subtitle"><span x-text="previewDocument.mimeType"></span> · <span x-text="documentPreviewSize"></span></p>
                            </div>
                            <button type="button" class="modal-close" @click="closeDocumentPreview" :aria-label="documentsCloseLabel">&times;</button>
                        </div>
                        <div class="document-preview-meta">
                            <strong x-text="documentsProvenanceLabel"></strong>
                            <div class="source-map-list">
                                <template x-for="source in previewDocument.sourceMap" :key="source.id">
                                    <span class="source-map-chip" x-text="source.label"></span>
                                </template>
                            </div>
                        </div>
                        <template x-if="previewHasProfile">
                            <div class="document-profile-card">
                                <div class="profile-heading"><span x-text="documentsProfileTitle"></span><strong x-text="previewProfile.documentType"></strong></div>
                                <p x-text="previewProfile.summary"></p>
                                <div class="profile-columns"><div><small x-text="documentsPeopleLabel"></small><div class="entity-cloud"><template x-for="person in previewProfile.people" :key="person"><span class="entity-chip person" x-text="person"></span></template></div></div><div><small x-text="documentsOrganizationsLabel"></small><div class="entity-cloud"><template x-for="organization in previewProfile.organizations" :key="organization"><span class="entity-chip organization" x-text="organization"></span></template></div></div></div>
                            </div>
                        </template>
                        <div id="document-preview-markdown" class="modal-body document-preview-markdown markdown-body" x-safe-html="previewMarkdown"></div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" @click="downloadPreviewDocument" x-text="documentsDownloadOriginalLabel"></button>
                            <button type="button" class="btn btn-primary" @click="closeDocumentPreview" x-text="documentsCloseLabel"></button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- =================================================================
             6. Toast Notification
             ================================================================= -->
        <div x-cloak x-show="hasToast" x-transition role="status" aria-live="polite"
             style="position: fixed; bottom: 24px; right: 24px; z-index: 200; background-color: var(--sealarca-ink); color: #FFFFFF; padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-lg);"
             x-text="toastMessage">
        </div>

    </div>

    <!-- =====================================================================
         Scripts locaux (Zéro CDN; les opérations IA nécessitent le réseau)
         ===================================================================== -->
    <script src="vendor/jszip.min.js?v=1.1.0"></script>
    <script src="vendor/pdf.worker.min.js?v=1.1.0"></script>
    <script src="vendor/pdf.min.js?v=1.1.0"></script>
    <script src="vendor/marked.min.js?v=1.1.0"></script>
    <script src="vendor/purify.min.js?v=1.1.0"></script>
    
    <script src="js/i18n.js?v=1.1.0"></script>
    <script src="js/db.js?v=1.1.0"></script>
    <script src="js/doc-handler.js?v=1.1.0"></script>
    <script src="js/api.js?v=1.1.0"></script>
    <script src="js/p1.js?v=1.1.0"></script>
    <script src="js/app.js?v=1.1.0"></script>
    <script src="vendor/alpine-csp.min.js?v=3.16.2" defer></script>
</body>
</html>
