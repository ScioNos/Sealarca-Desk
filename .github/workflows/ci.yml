name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Build local release with PowerShell 7
        shell: pwsh
        run: |
          npm run vendor:build
          ./scripts/build-release.ps1
      - name: Verify ZIP and extraction on Linux
        run: node scripts/verify-release.js
